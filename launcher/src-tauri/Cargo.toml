[package]
name = "launcher"
version = "0.1.0"
description = "Lanceur Learning Suite : modules, applis de la suite et outils"
authors = ["Learning Suite"]
license = "AGPL-3.0-or-later"
edition = "2024"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suite-core = { path = "../../crates/suite-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
