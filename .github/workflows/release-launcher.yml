# Publication : sur une étiquette « launcher-vX.Y.Z », GitHub construit les installateurs du lanceur,
# les signe (quand SignPath aura accepté le projet) et prépare une release brouillon à vérifier.
name: Release Lanceur

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Renseigné dans GitHub › Settings › Secrets quand SignPath aura validé le projet.
      # Tant qu'il est vide, les installateurs sont publiés NON signés.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            player/package-lock.json
            launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/suite-core
            launcher/src-tauri

      - name: Installer les outils
        run: |
          npm ci --prefix player
          npm ci --prefix launcher

      - name: Tests avant publication
        run: |
          npm test --prefix player
          cargo test --locked --manifest-path crates/suite-core/Cargo.toml

      - name: Construire les installateurs (.exe et .msi)
        working-directory: launcher
        run: npm run tauri build

      - name: Rassembler les fichiers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item launcher/src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item launcher/src-tauri/target/release/bundle/msi/*.msi dist/
          Get-ChildItem dist

      - name: Envoyer à SignPath (fichiers non signés)
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: launcher-unsigned
          path: dist/*

      - name: Signature par SignPath Foundation
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: learning-suite
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Sommes de contrôle
        shell: pwsh
        run: |
          Get-FileHash dist/*.exe, dist/*.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: launcher-windows
          path: dist/*

      - name: Release brouillon (à relire avant de publier)
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS.txt
