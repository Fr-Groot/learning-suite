<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- Mur et fenêtre -->
  <rect width="1000" height="600" fill="#EEF2FB"/>
  <rect x="60" y="40" width="240" height="180" rx="8" fill="#C9D6FF"/>
  <path d="M180 40 V220 M60 130 H300" stroke="#fff" stroke-width="8"/>
  <!-- Plante (neutre) -->
  <rect x="840" y="300" width="70" height="80" rx="8" fill="#B5651D"/>
  <ellipse cx="875" cy="280" rx="60" ry="55" fill="#1E9E5A"/>
  <ellipse cx="845" cy="250" rx="30" ry="40" fill="#24B36A"/>
  <!-- Bureau -->
  <rect x="0" y="380" width="1000" height="40" fill="#8A5A34"/>
  <rect x="0" y="420" width="1000" height="180" fill="#6E4628"/>
  <!-- Écran resté ouvert sur la messagerie -->
  <rect x="330" y="90" width="360" height="240" rx="14" fill="#1B2A4A"/>
  <rect x="345" y="105" width="330" height="200" rx="6" fill="#FFFFFF"/>
  <rect x="360" y="120" width="140" height="14" rx="7" fill="#2F5BEA"/>
  <rect x="360" y="150" width="290" height="10" rx="5" fill="#C9D6FF"/>
  <rect x="360" y="172" width="260" height="10" rx="5" fill="#C9D6FF"/>
  <rect x="360" y="194" width="280" height="10" rx="5" fill="#C9D6FF"/>
  <text x="510" y="285" font-family="Segoe UI, sans-serif" font-size="18" fill="#D64545" text-anchor="middle">Session ouverte</text>
  <rect x="490" y="330" width="40" height="40" fill="#1B2A4A"/>
  <rect x="440" y="368" width="140" height="14" rx="6" fill="#1B2A4A"/>
  <!-- Post-it avec le mot de passe -->
  <g transform="rotate(-6 700 120)">
    <rect x="655" y="80" width="95" height="85" fill="#FFE066"/>
    <text x="702" y="112" font-family="Segoe Print, Comic Sans MS, cursive" font-size="15" fill="#1B2A4A" text-anchor="middle">MDP :</text>
    <text x="702" y="140" font-family="Segoe Print, Comic Sans MS, cursive" font-size="15" fill="#1B2A4A" text-anchor="middle">Soleil2026</text>
  </g>
  <!-- Clé USB inconnue -->
  <rect x="160" y="395" width="90" height="34" rx="8" fill="#D64545"/>
  <rect x="250" y="402" width="30" height="20" fill="#9AA6BF"/>
  <text x="205" y="418" font-family="Segoe UI, sans-serif" font-size="13" fill="#fff" text-anchor="middle">USB ?</text>
  <!-- Tasse (neutre) -->
  <rect x="760" y="330" width="60" height="64" rx="8" fill="#FFFFFF" stroke="#9AA6BF" stroke-width="3"/>
  <path d="M820 345 q25 15 0 32" stroke="#9AA6BF" stroke-width="5" fill="none"/>
  <!-- Badge oublié -->
  <rect x="580" y="440" width="120" height="80" rx="10" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="4"/>
  <circle cx="612" cy="475" r="16" fill="#C9D6FF"/>
  <rect x="636" y="462" width="52" height="8" rx="4" fill="#1B2A4A"/>
  <rect x="636" y="480" width="40" height="8" rx="4" fill="#9AA6BF"/>
  <text x="640" y="508" font-family="Segoe UI, sans-serif" font-size="12" fill="#2F5BEA" text-anchor="middle">BADGE</text>
  <!-- Clavier (neutre) -->
  <rect x="330" y="440" width="220" height="60" rx="8" fill="#DDE3F0"/>
</svg>
